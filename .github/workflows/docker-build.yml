name: Build and Push Docker Image

# 代码在 beta 分支；main 只放一个 README，不含源码也不含本 workflow，
# 因此构建只可能由 beta（或 v* tag / 手动触发）驱动。
on:
  push:
    branches: [beta]
    tags: ['v*']
  pull_request:
    branches: [beta]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Rust tests
        run: cargo test --all-targets

  build:
    needs: test
    # 两种架构各在自己的原生 runner 上构建。arm64 若走 QEMU 模拟，要把整棵
    # Rust 依赖树重编一遍，耗时以小时计且容易超时；原生 arm64 runner 对 public
    # 仓库免费。一个架构失败不掩盖另一个的结果。
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # GHCR 只接受全小写镜像名，而仓库名可能含大写字母
      # (例如 Ciallo_Freemodel_Proxy)，必须显式转换。
      - name: Compute lowercase image name
        id: img
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 这里只取 labels（来源仓库、commit、构建时间）。tag 由 merge job 统一打，
      # 单架构镜像在合并前不该带任何 tag。
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.img.outputs.name }}

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 先 load 到本机跑冒烟测试，再推送：坏镜像不该先落到用户能 pull 的 tag 上。
      # 这一步和下面的推送共用同一份 cache，第二次构建几乎不额外花时间。
      - name: Build image locally
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          load: true
          push: false
          tags: ${{ steps.img.outputs.name }}:ci-smoke
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}

      # 只验证默认 cc 配置能起来并正确鉴权，不发上游请求、不消耗额度。
      # 在原生 runner 上跑，因此 arm64 镜像是真的在 arm64 上验证过的。
      - name: Smoke test default cc transport
        run: bash test/test-cc-smoke.sh "${{ steps.img.outputs.name }}:ci-smoke"

      # 按 digest 推送、不带 tag：两个架构各推各的，最后由 merge job 合成
      # manifest list。中途没有任何 tag 指向单架构镜像，用户不会 pull 到
      # 只覆盖一半架构的 latest。
      - name: Build and push by digest
        id: push
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ steps.img.outputs.name }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}

      - name: Export digest
        if: github.event_name != 'pull_request'
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.push.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digest-*
          merge-multiple: true

      - name: Compute lowercase image name
        id: img
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.img.outputs.name }}
          # latest 显式绑定到 beta：默认分支是 main（只有 README），
          # 用 {{is_default_branch}} 会导致 latest 永远不被推送，
          # 用户 docker pull :latest 就会 404。
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/beta' }}

      # tag 到这一步才第一次指向镜像，且一次就指向含两种架构的 manifest list。
      - name: Create manifest list and push
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ steps.img.outputs.name }}@sha256:%s ' *)

      # 只推上去不等于合对了：manifest 少一个架构时，用户侧的表现正是
      # "platform does not match" 那句警告，必须在 CI 就拦住。
      # 用 jq 读 platform 而不是 grep 原始 JSON：raw 输出的缩进随 buildx 版本变，
      # 靠字符串匹配会在某次升级后静默变成永远通过。
      - name: Verify both architectures are present
        run: |
          for tag in $(jq -cr '.tags[]' <<< "$DOCKER_METADATA_OUTPUT_JSON"); do
            platforms=$(docker buildx imagetools inspect "$tag" --raw \
              | jq -r '.manifests[]? | select(.platform) | "\(.platform.os)/\(.platform.architecture)"')
            for want in linux/amd64 linux/arm64; do
              grep -qx "$want" <<< "$platforms" || {
                echo "FAIL: $tag 的 manifest 缺少 $want，实际只有：" >&2
                echo "$platforms" >&2
                exit 1
              }
            done
            echo "OK: $tag 同时包含 linux/amd64 与 linux/arm64"
          done
