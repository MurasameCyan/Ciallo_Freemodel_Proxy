name: Build and Push Docker Image

# 代码在 beta 分支；main 只放一个 README，不含源码也不含本 workflow，
# 因此构建只可能由 beta（或 v* tag / 手动触发）驱动。
on:
  push:
    branches: [beta]
    tags: ['v*']
  pull_request:
    branches: [beta]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Rust tests
        run: cargo test --all-targets

      # GHCR 只接受全小写镜像名，而仓库名可能含大写字母
      # (例如 Ciallo_Freemodel_Proxy)，必须显式转换。
      - name: Compute lowercase image name
        id: img
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.img.outputs.name }}
          # latest 显式绑定到 beta：默认分支是 main（只有 README），
          # 用 {{is_default_branch}} 会导致 latest 永远不被推送，
          # 用户 docker pull :latest 就会 404。
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/beta' }}

      # 仅构建 linux/amd64。arm64 需经 QEMU 模拟编译整个 Rust 依赖树
      # (含 LTO)，耗时可达一小时以上且易超时。如需 arm64，见 DOCKER.md。
      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
