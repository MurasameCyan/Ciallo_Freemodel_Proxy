services:
  freemodel-proxy:
    # GHCR 镜像名必须全小写，因此这里是 murasamecyan/ciallo_freemodel_proxy
    # 而非仓库原名 MurasameCyan/Ciallo_Freemodel_Proxy。
    # 想从源码构建就注释掉 image、启用 build。
    image: ghcr.io/${IMAGE_REPO:-murasamecyan/ciallo_freemodel_proxy}:latest
    # build: .
    container_name: freemodel-proxy
    restart: unless-stopped
    ports:
      # 默认只绑宿主机 127.0.0.1。要给局域网用就改成 0.0.0.0，
      # 但必须同时设置 PROXY_API_KEY，否则谁都能用你的额度。
      # 容器内固定监听 40589，这里只改宿主机侧。
      - "${PROXY_BIND:-127.0.0.1}:${PROXY_HOST_PORT:-40589}:40589"
    environment:
      # cc.freemodel.dev 只认 Bearer {FREEMODEL_API_KEY}，不需要任何登录态。
      FREEMODEL_BASE_URL: ${FREEMODEL_BASE_URL:-https://cc.freemodel.dev/v1}
      FREEMODEL_TRANSPORT: ${FREEMODEL_TRANSPORT:-cc_anthropic}
      # 你的 Freemodel key。留空可在启动后用 key set 写入 /data 卷。
      FREEMODEL_API_KEY: ${FREEMODEL_API_KEY:-}
      # 客户端调用本代理时使用的密钥，不要把 Freemodel key 直接发给客户端。
      PROXY_API_KEY: ${PROXY_API_KEY:-}
    volumes:
      # 代理会话元数据与运行时文件。
      - proxy-data:/data
      # 供客户端访问的工作目录，对应 PROXY_DEFAULT_PROJECT。
      - ./workspace:/workspace

volumes:
  proxy-data:
